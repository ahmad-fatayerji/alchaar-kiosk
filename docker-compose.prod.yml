services:
  db:
    image: postgres:16
    restart: unless-stopped
    # Allow Postgres time to shutdown cleanly when the stack stops/restarts
    stop_grace_period: 60s
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kiosk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_DB: ${POSTGRES_DB:-pharmacy}
    volumes:
      - dbdata:/var/lib/postgresql/data
      - backups:/backups
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-kiosk} -d ${POSTGRES_DB:-pharmacy} || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
    # Publish DB to the host for external access (optional; remove in locked-down prod)
    ports:
      - "5432:5432"

  app:
    image: ${APP_IMAGE:-ghcr.io/ahmad-fatayerji/alchaar-kiosk:latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      POSTGRES_USER: ${POSTGRES_USER:-kiosk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_DB: ${POSTGRES_DB:-pharmacy}
      POSTGRES_HOST: db
      PORT: "3000"
      # Admin panel authentication
      NEXT_PUBLIC_ADMIN_PASS: ${NEXT_PUBLIC_ADMIN_PASS:-admin}
      # Kiosk configuration flags
      NEXT_PUBLIC_HIDE_PRICES: ${NEXT_PUBLIC_HIDE_PRICES:-false}
      NEXT_PUBLIC_SALES_ENABLED: ${NEXT_PUBLIC_SALES_ENABLED:-true}
      NEXT_PUBLIC_HIDE_STOCK: ${NEXT_PUBLIC_HIDE_STOCK:-false}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - ./public/products:/app/public/products
      - ./docker/entrypoint.sh:/app/docker/entrypoint.sh:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  dbdata:
  backups:
